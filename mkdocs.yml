site_name: ccodex
site_description: Manages multiple Codex and Claude Code sessions, so you don't have to.

# No published site for this fork (yet) — site_url is what a `docs-serve.sh` local
# preview and any future Pages build would announce; the repo links point here.
site_url: https://lczh.github.io/ccodex/
repo_url: https://github.com/lczh/ccodex
repo_name: lczh/ccodex

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/romp-wordmark.png
  favicon: assets/brand/romp-icon-swirl-glyph.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Dark only — romp is a dark UI and every capture is dark. The header blue
    # is the session blue #1EA1EB (see docs/stylesheets/extra.css).
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/tabsync.js
  - javascripts/lazyvideo.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Overview: index.md
  - Install: install.md
  - Guide: guide.md
  - Codex sessions: codex.md
  - Reference: reference.md
  - Internals:
      - How Romp works: architecture.md
      - Judges: judges.md
      - The judge pipeline: judge-pipeline.md
      - How a card gets its state: goal-state.md
      - The event model: event-model.md
      - The read side: read-side.md
